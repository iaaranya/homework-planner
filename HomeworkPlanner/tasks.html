
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - StudySpace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fc;
            color: #172033;
        }

        .dashboard {
            display: flex;
            max-width: 1200px;
            min-height: 85vh;
            margin: auto;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 40px #1e375014;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            padding: 28px 18px;
            background: #172b4d;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .brand {
            color: white;
            margin: 0 0 32px;
        }

        .sidebar-label {
            color: #aabbd6;
            font-size: 11px;
            font-weight: bold;
        }

        .nav-item {
            display: block;
            padding: 13px;
            margin: 5px 0;
            border-radius: 10px;
            color: #dce6f7;
            text-decoration: none;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #2b4268;
            color: white;
        }

        .planner {
            flex: 1;
            min-width: 0;
            padding: 36px;
        }

        h1 {
            color: #2457d6;
        }

        h2 {
            margin-top: 30px;
        }

        p {
            color: #718096;
            line-height: 1.6;
        }

        .form {
            display: grid;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            font: inherit;
        }

        button {
            padding: 11px 15px;
            border: none;
            border-radius: 10px;
            background: #285ee8;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        .form button {
            padding: 14px;
        }

        .progress-section {
            margin: 20px 0;
            padding: 22px;
            background: #eef4ff;
            border-radius: 18px;
        }

        #taskCounter {
            color: #2457d6;
            font-weight: bold;
        }

        .progress-track {
            height: 12px;
            background: #dbe6fb;
            border-radius: 20px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #3972f6;
            transition: width 0.3s;
        }

        #taskList {
            padding: 0;
            list-style: none;
        }

        #taskList li {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 12px 0;
            padding: 16px;
            border: 1px solid #e8edf5;
            border-radius: 14px;
        }

        #taskList li span:first-child {
            flex: 1;
            min-width: 140px;
            overflow-wrap: anywhere;
        }

        #taskList li .done {
            color: #159568;
            text-decoration: line-through;
        }

        #taskList li button:last-child {
            background: #fff0f0;
            color: #c43c46;
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .planner {
                padding: 22px 16px;
            }
        }

/* Weekly calendar */
.weekly-calendar {
    margin: 30px 0;
    padding: 20px;
    background: #ffffff;
    border: 1px solid #e0e7f2;
    border-radius: 18px;
    box-shadow: 0 5px 18px rgba(30, 55, 90, 0.05);
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.calendar-header h2 {
    margin: 0;
}

.calendar-buttons {
    display: flex;
    gap: 6px;
}

.calendar-buttons button {
    padding: 8px 12px;
}

#weekLabel {
    font-size: 14px;
    font-weight: 600;
    color: #2457d6;
    margin: 16px 0;
}

.calendar-days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
}

.calendar-day {
    min-height: 125px;
    min-width: 0;
    padding: 10px 6px;
    background: #f5f8ff;
    border: 1px solid #e2e9f6;
    border-radius: 12px;
}

.calendar-day.today {
    border: 2px solid #3972f6;
    background: #edf3ff;
}

.calendar-day h3 {
    margin: 0 0 4px;
    font-size: 13px;
    color: #2457d6;
}

.calendar-day .day-number {
    font-size: 20px;
    font-weight: bold;
    color: #172033;
}

.calendar-task {
    margin-top: 8px;
    padding: 6px;
    background: #dce8ff;
    color: #214ba8;
    border-radius: 6px;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.calendar-task.completed {
    background: #d9f5e8;
    color: #16734e;
    text-decoration: line-through;
}

@media (max-width: 700px) {
    .calendar-days {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

    </style>
</head>

<body>
    <div class="dashboard">

        <aside class="sidebar">
            <h2 class="brand">StudySpace</h2>
            <p class="sidebar-label">YOUR WORKSPACE</p>

            <a class="nav-item" href="index.html">
                ▦ Dashboard
            </a>

            <a class="nav-item active" href="tasks.html">
                ✓ My Tasks
            </a>
        </aside>

        <main class="planner">
            <h1>My Tasks</h1>
            <p>Add your homework and track your progress.</p>

            <form class="form" id="homeworkForm">
                <input
                    type="text"
                    id="task"
                    placeholder="Enter your homework"
                    required
                >

                <input
                    type="date"
                    id="deadline"
                    required
                >

                <button type="submit">+ Add Task</button>
            </form>

<div class="weekly-calendar">
    <div class="calendar-header">
        <div>
            <h2>Weekly Calendar 📅</h2>
            <p>See your homework by deadline.</p>
        </div>

        <div class="calendar-buttons">
            <button type="button" id="prevWeek">←</button>
            <button type="button" id="thisWeek">Today</button>
            <button type="button" id="nextWeek">→</button>
        </div>
    </div>

    <p id="weekLabel"></p>
    <div id="calendarDays" class="calendar-days"></div>
</div>

            <h2>My progress</h2>

            <div class="progress-section">
                <p id="taskCounter">0 of 0 tasks completed</p>

                <div class="progress-track">
                    <div id="progressBar"></div>
                </div>

                <p id="progressMessage">Let's get started!</p>
            </div>

            <h2>My task list</h2>
            <ul id="taskList"></ul>
        </main>
    </div>

    <script>
        const form = document.getElementById("homeworkForm");
        const taskInput = document.getElementById("task");
        const deadlineInput = document.getElementById("deadline");
        const taskList = document.getElementById("taskList");

        let tasks = JSON.parse(
            localStorage.getItem("homeworkTasks")
        ) || [];

let calendarWeek = new Date();

function getMonday(date) {
    const monday = new Date(date);
    monday.setHours(0, 0, 0, 0);

    const day = monday.getDay();
    const difference = day === 0 ? -6 : 1 - day;

    monday.setDate(monday.getDate() + difference);
    return monday;
}

function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
}

function renderWeeklyCalendar() {
    const calendarDays = document.getElementById("calendarDays");
    const weekLabel = document.getElementById("weekLabel");

    calendarDays.innerHTML = "";

    const monday = getMonday(calendarWeek);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    weekLabel.textContent =
        monday.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short"
        }) + " – " +
        sunday.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });

    const today = formatDate(new Date());

    for (let i = 0; i < 7; i++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + i);

        const dateKey = formatDate(date);

        const dayBox = document.createElement("div");
        dayBox.className = "calendar-day";

        if (dateKey === today) {
            dayBox.classList.add("today");
        }

        const dayName = document.createElement("h3");
        dayName.textContent = date.toLocaleDateString("en-IN", {
            weekday: "short"
        });

        const dayNumber = document.createElement("div");
        dayNumber.className = "day-number";
        dayNumber.textContent = date.getDate();

        dayBox.appendChild(dayName);
        dayBox.appendChild(dayNumber);

        const dayTasks = tasks.filter(function(task) {
            return task.deadline === dateKey;
        });

        dayTasks.forEach(function(task) {
            const taskBox = document.createElement("div");
            taskBox.className = "calendar-task";

            if (task.done) {
                taskBox.classList.add("completed");
            }

            taskBox.textContent =
                (task.done ? "✓ " : "") + task.name;

            dayBox.appendChild(taskBox);
        });

        calendarDays.appendChild(dayBox);
    }
}

document.getElementById("prevWeek").addEventListener("click", function() {
    calendarWeek.setDate(calendarWeek.getDate() - 7);
    renderWeeklyCalendar();
});

document.getElementById("nextWeek").addEventListener("click", function() {
    calendarWeek.setDate(calendarWeek.getDate() + 7);
    renderWeeklyCalendar();
});

document.getElementById("thisWeek").addEventListener("click", function() {
    calendarWeek = new Date();
    renderWeeklyCalendar();
});

        function saveTasks() {
            localStorage.setItem(
                "homeworkTasks",
                JSON.stringify(tasks)
            );
        }

        function showTasks() {
            taskList.innerHTML = "";

            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(function(task) {
                return task.done;
            }).length;

            const percentage = totalTasks === 0
                ? 0
                : Math.round((completedTasks / totalTasks) * 100);

            document.getElementById("taskCounter").textContent =
                completedTasks + " of " + totalTasks + " tasks completed";

            document.getElementById("progressBar").style.width =
                percentage + "%";

            const message = document.getElementById("progressMessage");

            if (totalTasks === 0) {
                message.textContent = "Let's get started!";
            } else if (percentage === 100) {
                message.textContent = "Amazing! All tasks completed! 🎉";
            } else {
                message.textContent = percentage + "% complete. Keep going!";
            }

            tasks.forEach(function(task, index) {
                const li = document.createElement("li");
                const name = document.createElement("span");
                const date = document.createElement("span");
                const doneButton = document.createElement("button");
                const deleteButton = document.createElement("button");

                name.textContent = task.name;
                if (task.done) {
                    name.classList.add("done");
                }

                date.textContent = "Due: " + task.deadline;

                doneButton.textContent = task.done ? "Undo" : "Done";
                doneButton.onclick = function() {
                    tasks[index].done = !tasks[index].done;
                    saveTasks();
                    showTasks();
                };

                deleteButton.textContent = "Delete";
                deleteButton.onclick = function() {
                    tasks.splice(index, 1);
                    saveTasks();
                    showTasks();
                };

                li.appendChild(name);
                li.appendChild(date);
                li.appendChild(doneButton);
                li.appendChild(deleteButton);
                taskList.appendChild(li);
            });
            renderWeeklyCalendar();
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const taskName = taskInput.value.trim();
            const deadline = deadlineInput.value;

            if (taskName === "" || deadline === "") {
                return;
            }

            tasks.push({
                name: taskName,
                deadline: deadline,
                done: false
            });

            saveTasks();
            showTasks();
            form.reset();
        });

        showTasks();
    </script>
</body>
</html>
